name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-ci-placeholder
      NEXT_PUBLIC_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_CONTRACT_ADDRESS: "0xdb76e1ca5056c550afcd2084fc571c7fef2e89ae"
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: "1234567890"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build
