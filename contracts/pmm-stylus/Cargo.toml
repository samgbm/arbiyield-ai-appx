[package]
name = "pmm-stylus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Melee Parimutuel Market Maker (PMM) — anti-dilution Stylus contract"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.8"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
stylus-test = ["stylus-sdk/stylus-test"]
contract-client-gen = []

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = 3
